{% extends "base.html" %}{% block content %}<h1>My Orders</h1><section class="grid">{% for o in orders %}<article class="card"><h3>Order #{{ o.id }}</h3><p>{{ o.items }}</p><p>Total: ₹{{ "%.2f"|format(o.total) }}</p><strong>Status: {{ o.status }}</strong></article>{% else %}<p>No orders yet.</p>{% endfor %}</section>{% endblock %}
